name: Secret Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Block known secret patterns
        run: |
          set -euo pipefail
          PATTERNS=(
            'sk-proj-[A-Za-z0-9_-]{20,}'
            'mongodb\+srv://[^:]+:[^@]+@'
            'TELEGRAM_BOT_TOKEN=[0-9]+:[A-Za-z0-9_-]+'
            'OANDA_API_KEY=[a-f0-9]{20,}'
            'EMAIL_PASSWORD=[A-Za-z0-9]{8,}'
          )
          for pattern in "${PATTERNS[@]}"; do
            if git grep -E "$pattern" -- ':!*.example' ':!.github/workflows/secret-scan.yml' ':!SECURITY.md' ':!tests/test_config.py' 2>/dev/null; then
              echo "::error::Potential secret detected matching pattern: $pattern"
              exit 1
            fi
          done
          echo "No secret patterns detected."
